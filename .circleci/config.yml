# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1
jobs:
  test:
    docker:
      - image: cimg/node:26.3.1
    steps:
      - checkout
      - run:
          name: Initialize package.json
          command: |
            if [ ! -f package.json ]; then
              npm init -y
            fi
      - run:
          name: Install Jest Testing Framework
          command: npm install --save-dev jest jest-environment-jsdom
      - run:
          name: Run Unit Tests
          command: npx jest myapp.test.js
      - persist_to_workspace:
          root: .
          paths:
            - index.html

  deploy:
    docker:
      - image: cimg/node:26.3.1
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Deploying Application
          command: |
            echo "Your application is verified and ready for hosting!"

workflows:
  build-test-publish:
    jobs:
      - test
      - deploy:
          requires:
            - test
